# ============================================================
# sm8750（骁龙 8 Elite / 天玑 9400+）6.6 平台编译配置
# 由 scripts/build/lib.sh 按 PLATFORM_DIR=sm8750 自动加载
# ============================================================

# ---- 工具链（AOSP LLVM/Clang 18）----
TOOLCHAIN_TAG="LLVM-Clang18-r510928"
TOOLCHAIN_BASE="https://github.com/SunsetRNE/oneplus_sm8650_toolchain/releases/download/$TOOLCHAIN_TAG"
CLANG_DIR="clang18"
CLANG_ZIP="clang-r510928.zip"
CLANG_LABEL="llvm-Clang18"
HAS_RUST=0

# ---- 源码准备 ----
ABI_PROTECT_RM=1                 # 删除 abi_gki_protected_exports_* 绕过 ABI 保护

# ---- 平台补丁 ----
CVE_PATCH="cve-2026-43499-rtmutex-6.6.patch"

HIDE_STUFF=0

LZ4_GIT_APPLY=1

LZ4_ARMV8=1

# ---- 平台特性 ----
IOSCHED="adios"                  # adios | ssg
DROIDSPACES_PATCHES=(            # Droidspaces 必须补丁（按应用顺序）
  fix_sysvipc_kabi_6_7_8.patch
  fix_oplus_bsp_midas.patch
  ntsync_base.patch
  "ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
)
DROIDSPACES_EVDI=1               # extend 分支是否启用 Lindroid EVDI 驱动

# ---- 版本命名 ----
DEFCONFIG_SUFFIX_SED=1           # 制作名称时同步替换 defconfig 内 -4k 标记

# ---- 发布 ----
RELEASE_CLEAN_SUB_VERSION=1      # 发布标题剥离 _mtk/_gki 后缀
KSU_OFFICIAL_NAME="KSU"          # 原版 KSU 在发布文案中的名称
