# ============================================================
# sm8650（骁龙 8 Gen3 / 天玑 9400e / 天玑 8350）6.1 平台编译配置
# 由 scripts/build/lib.sh 按 PLATFORM_DIR=sm8650 自动加载
# ============================================================

# ---- 工具链（AOSP LLVM/Clang 20）----
TOOLCHAIN_TAG="LLVM-Clang20-r547379"
TOOLCHAIN_BASE="https://github.com/SunsetRNE/oneplus_sm8650_toolchain/releases/download/$TOOLCHAIN_TAG"
CLANG_DIR="clang20"
CLANG_ZIP="clang-r547379.zip"
CLANG_LABEL="llvm-Clang20"
HAS_RUST=0

# ---- 源码准备 ----
ABI_PROTECT_RM=1                 # 删除 abi_gki_protected_exports_* 绕过 ABI 保护

# ---- 平台补丁 ----
CVE_PATCH="cve-2026-43499-rtmutex-6.1.patch"

HIDE_STUFF=1

LZ4_GIT_APPLY=1

LZ4_ARMV8=1

# ---- 平台特性 ----
IOSCHED="ssg"                    # adios | ssg
DROIDSPACES_PATCHES=(            # Droidspaces 必须补丁（按应用顺序）
  fix_sysvipc_kabi_6_7_8.patch
  fix_oplus_bsp_midas.patch
  ntsync_base.patch
  "ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
)
DROIDSPACES_EVDI=1               # extend 分支是否启用 Lindroid EVDI 驱动

# ---- 版本命名 ----
DEFCONFIG_SUFFIX_SED=0           # 6.1 系列 KERNEL_NAME 无 -4k 标记，无需替换 defconfig

# ---- 发布 ----
RELEASE_CLEAN_SUB_VERSION=0      # 6.1 系列无 _mtk/_gki 复合版本号
KSU_OFFICIAL_NAME="KernelSU (Official)"
