name: 发布测试（三平台矩阵）

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '测试平台 (all=全部三平台, 或指定单个)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'sm8850'
          - 'sm8750'
          - 'sm8650'
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认ReSukiSU)'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启kpm(builtin-使用(re)sukisu内置kpm, kpn-使用独立kpm实现(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'builtin'
          - 'kpn'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁及 LZ4KD 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: '是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(适用 sm8850/sm8750)'
        required: true
        type: boolean
        default: 'true'
      ssg_enable:
        description: '是否启用三星SSG IO调度器(适用 sm8650)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    if: ${{ github.event.inputs.platform == 'all' || contains(fromJson('["sm8850","sm8750","sm8650"]'), github.event.inputs.platform) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: sm8850
            ANDROID_VERSION: 'android16'
            KERNEL_VERSION: '6.12'
            SUB_VERSION: '23'
            KERNEL_NAME: 'android16-5-ga8f88ad96df3-ab13929693-4k'
            CCACHE_KEY: ccache-neov5-6.12.23
            PLATFORM_DESC: '骁龙8 Elite Gen5 (SM8850) / 天玑 9500 (MT6993)'
            SOURCE_DESC: '一加15 6.12.23 版官方源码'
          - platform: sm8750
            ANDROID_VERSION: 'android15'
            KERNEL_VERSION: '6.6'
            SUB_VERSION: '89'
            KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
            CCACHE_KEY: ccache-neov4-6.6.89
            PLATFORM_DESC: '骁龙 8 Elite (SM8750) / 天玑 9400+ (MT6991)'
            SOURCE_DESC: '一加13 6.6.89 版官方源码'
          - platform: sm8650
            ANDROID_VERSION: 'android14'
            KERNEL_VERSION: '6.1'
            SUB_VERSION: '118'
            KERNEL_NAME: 'android14-11-o-gca13bffobf09'
            CCACHE_KEY: ccache-neov4-6.1.118
            PLATFORM_DESC: '骁龙 8 Gen3 (SM8650) / 天玑 9400e (MT6989) / 天玑 8350 (MT6897)'
            SOURCE_DESC: '一加12 6.1.118 版官方源码'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      ANDROID_VERSION: ${{ matrix.ANDROID_VERSION }}
      KERNEL_VERSION: ${{ matrix.KERNEL_VERSION }}
      SUB_VERSION: ${{ matrix.SUB_VERSION }}
      KERNEL_NAME: ${{ matrix.KERNEL_NAME }}
      CCACHE_KEY: ${{ matrix.CCACHE_KEY }}
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      platform: ${{ matrix.platform }}
    steps:
      - name: 添加KernelSU版本号
        id: ksu_version
        run: |
          KSU_VERSION="114514"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            KSU_TYPENAME="ReSukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          truncate -s 30M testfile
          zip -r ./$AK3_NAME ./testfile
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/AnyKernel*.zip
          archive: false

      # 注：本工作流仅为打包/管线测试，不再创建 GitHub Release（正式发布一律走 sm*_fastbuild_*.yml）
