name: 🎛️ 统一编译生成器（参数入队）

# 独立于编译体系之外：只负责"生成任务入队"，不触发编译
# 编译触发由 compile_trigger.yml（触发器）消费 queue/pending/ 完成
# 链式触发器：仅列出有配置档案的工作流（无档案 = 无链 = 不显示/不触发/不警告）
# 表单预设参数 = 各编译工作流的预设默认值（已建档校准）；参数可改，改后自负验证责任
# ⚠️ workflow 选项块由 scripts/dispatcher/sync_profile_options.py 自动维护
#    （BEGIN_PROFILE_OPTIONS / END_PROFILE_OPTIONS 之间），勿手改

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: '目标编译工作流（仅列有验证档案的；参数默认值已按档案预设）'
        required: true
        type: choice
        options:
          # BEGIN_PROFILE_OPTIONS
          - 'sm8650_fastbuild_6.1.115.yml'
          - 'sm8650_fastbuild_6.1.118.yml'
          - 'sm8650_fastbuild_6.1.128.yml'
          - 'sm8650_fastbuild_6.1.134.yml'
          - 'sm8650_fastbuild_6.1.141.yml'
          - 'sm8650_fastbuild_6.1.57.yml'
          - 'sm8650_fastbuild_6.1.75.yml'
          - 'sm8750_fastbuild_6.6.118.yml'
          - 'sm8750_fastbuild_6.6.30.yml'
          - 'sm8750_fastbuild_6.6.50.yml'
          - 'sm8750_fastbuild_6.6.56.yml'
          - 'sm8750_fastbuild_6.6.57.yml'
          - 'sm8750_fastbuild_6.6.66.yml'
          - 'sm8750_fastbuild_6.6.89.yml'
          - 'sm8750_fastbuild_6.6.89_mtk.yml'
          - 'sm8850_fastbuild_6.12.23.yml'
          - 'sm8850_fastbuild_6.12.23_gki.yml'
          - 'sm8850_fastbuild_6.12.23_mtk.yml'
          - 'sm8850_fastbuild_6.12.38.yml'
          - 'sm8850_fastbuild_6.12.58.yml'
          - 'sm8850_fastbuild_6.12.58_mtk.yml'
          # END_PROFILE_OPTIONS
      ksu_type:
        description: 'KSU分支（resukisu/sukisu/ksunext/ksu原版/none；原版ksu已可用，ADR-010已解决）'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs（隐藏环境挂载增强；上游不稳定时可关闭）'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启kpm（KpatchNext独立实现；不需要保持关闭）'
        required: true
        type: boolean
        default: false
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁（与 lz4 互斥，勿同开）'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: 'bbr算法（false关闭 / true仅加入算法 / default启用并设为默认）'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: 'Droidspaces容器支持（false关闭 / standard开启+ntsync / extend更多测试项）'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '网络功能拓展（ipset/iptables 等高级网络功能内核支持）'
        required: true
        type: boolean
        default: false
      adios_enable:
        description: 'ADIOS（IO调度器：截止时间优先+自主学习自适应延迟控制，降低I/O延迟并设为默认；仅sm8750/sm8850平台生效）'
        required: true
        type: boolean
        default: true
      ssg_enable:
        description: 'SSG（三星IO调度器，提升读写性能；仅sm8650平台生效；一加12等极少数机型可能不开机，出bug请关闭）'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: 'Re-Kernel支持（配合 Freezer/NoActive 等提升应用冻结）'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '内核级基带保护（阻止非用户分区写入，防格机）'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存（改配置/源码/需刷新缓存时开启）'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: '上传 Ccache 调试日志（调试用，无需开启）'
        required: true
        type: boolean
        default: false
      suffix_mode:
        description: '内核后缀模式（留空=默认版本名；自动=SunsetRNE_时间戳_随机数；自定义=手动填）'
        required: true
        type: choice
        default: 'empty'
        options:
          - 'empty'
          - 'auto'
          - 'custom'
      suffix_custom:
        description: '自定义内核后缀（仅 suffix_mode=custom 时使用；⚠️禁止空格！建议 SunsetRNE_20260804_001 格式）'
        required: false
        type: string
        default: ''
      delay_until:
        description: '延迟触发时间（格式 2026-08-04 15:00，UTC+8；留空=立即）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: pip install --quiet pyyaml

      - name: 校验参数并生成任务（dry-run 预检）
        env:
          WORKFLOW: ${{ github.event.inputs.workflow }}
          KSU_TYPE: ${{ github.event.inputs.ksu_type }}
          SUSFS_ENABLE: ${{ github.event.inputs.susfs_enable }}
          KPM_ENABLE: ${{ github.event.inputs.kpm_enable }}
          LZ4_ENABLE: ${{ github.event.inputs.lz4_enable }}
          LZ4KD_ENABLE: ${{ github.event.inputs.lz4kd_enable }}
          BBR_ENABLE: ${{ github.event.inputs.bbr_enable }}
          DROIDSPACES_ENABLE: ${{ github.event.inputs.droidspaces_enable }}
          BETTER_NET: ${{ github.event.inputs.better_net }}
          ADIOS_ENABLE: ${{ github.event.inputs.adios_enable }}
          SSG_ENABLE: ${{ github.event.inputs.ssg_enable }}
          REKERNEL_ENABLE: ${{ github.event.inputs.rekernel_enable }}
          BASEBAND_GUARD: ${{ github.event.inputs.baseband_guard }}
          CCACHE_UPDATE: ${{ github.event.inputs.ccache_update }}
          CCACHE_DEBUG: ${{ github.event.inputs.ccache_debug }}
          SUFFIX_MODE: ${{ github.event.inputs.suffix_mode }}
          SUFFIX_CUSTOM: ${{ github.event.inputs.suffix_custom }}
          DELAY_UNTIL: ${{ github.event.inputs.delay_until }}
        run: python3 scripts/dispatcher/generate_tasks.py --dry-run

      - name: 正式入队 queue/pending/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: ${{ github.event.inputs.workflow }}
          KSU_TYPE: ${{ github.event.inputs.ksu_type }}
          SUSFS_ENABLE: ${{ github.event.inputs.susfs_enable }}
          KPM_ENABLE: ${{ github.event.inputs.kpm_enable }}
          LZ4_ENABLE: ${{ github.event.inputs.lz4_enable }}
          LZ4KD_ENABLE: ${{ github.event.inputs.lz4kd_enable }}
          BBR_ENABLE: ${{ github.event.inputs.bbr_enable }}
          DROIDSPACES_ENABLE: ${{ github.event.inputs.droidspaces_enable }}
          BETTER_NET: ${{ github.event.inputs.better_net }}
          ADIOS_ENABLE: ${{ github.event.inputs.adios_enable }}
          SSG_ENABLE: ${{ github.event.inputs.ssg_enable }}
          REKERNEL_ENABLE: ${{ github.event.inputs.rekernel_enable }}
          BASEBAND_GUARD: ${{ github.event.inputs.baseband_guard }}
          CCACHE_UPDATE: ${{ github.event.inputs.ccache_update }}
          CCACHE_DEBUG: ${{ github.event.inputs.ccache_debug }}
          SUFFIX_MODE: ${{ github.event.inputs.suffix_mode }}
          SUFFIX_CUSTOM: ${{ github.event.inputs.suffix_custom }}
          DELAY_UNTIL: ${{ github.event.inputs.delay_until }}
        run: python3 scripts/dispatcher/generate_tasks.py

      - name: 输出摘要（完整配置）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/dispatcher/generate_tasks.py --summary >> "$GITHUB_STEP_SUMMARY"