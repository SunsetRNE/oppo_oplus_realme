# ============================================================
# sm8850（骁龙 8 Elite Gen5 / 天玑 9500）6.12 平台编译配置
# 由 scripts/build/lib.sh 按 PLATFORM_DIR=sm8850 自动加载
# ============================================================

# ---- 工具链（AOSP LLVM/Clang 19 + Rust 1.82）----
TOOLCHAIN_TAG="LLVM-Clang19-r536225"
TOOLCHAIN_BASE="https://github.com/SunsetRNE/oneplus_sm8650_toolchain/releases/download/$TOOLCHAIN_TAG"
CLANG_DIR="clang19"
CLANG_ZIP="clang-r536225.zip"
CLANG_LABEL="llvm-clang19"
HAS_RUST=1                       # 6.12 内核含 Rust 代码，必须启用

# ---- 源码准备 ----
ABI_PROTECT_RM=0                 # 6.12 源码无 abi_gki_protected_exports 文件

# ---- 平台补丁 ----
CVE_PATCH="cve-2026-43499-rtmutex-6.12.patch"

HIDE_STUFF=0

LZ4_GIT_APPLY=0

LZ4_ARMV8=0

# ---- 平台特性 ----
IOSCHED="adios"                  # adios | ssg
DROIDSPACES_PATCHES=(            # Droidspaces 必须补丁（按应用顺序）
  fix_sysvipc_kabi_a16-6.12.patch
  fix_oplus_bsp_midas.patch
  ddl_hit_hook.patch
  "ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
)
DROIDSPACES_EVDI=0               # extend 分支是否启用 Lindroid EVDI 驱动

# ---- 版本命名 ----
DEFCONFIG_SUFFIX_SED=1           # 制作名称时同步替换 defconfig 内 -4k 标记

# ---- 发布 ----
RELEASE_CLEAN_SUB_VERSION=1      # 发布标题剥离 _mtk/_gki 后缀
KSU_OFFICIAL_NAME="KSU"          # 原版 KSU 在发布文案中的名称
