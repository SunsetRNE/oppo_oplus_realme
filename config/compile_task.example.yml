# ============================================================
# 统一编译任务配置模板（入口B：文件驱动，预留）
# ------------------------------------------------------------
# 说明：
#   1. 本文件是"中文配置 → 标准任务JSON"的模板示例
#   2. 当前骨架阶段：生成器主入口为表单（compile_dispatcher.yml）
#      本文件驱动模式（复制本文件→中文修改→生成器读取解析）为预留扩展
#   3. 每个字段均有中文注释，任何人可直接中文修改
# ============================================================

# 任务列表：每个任务是一个映射（平台+版本 → 一个编译）
tasks:
  # ---------- 任务1 ----------
  - 平台: sm8850                # 可选: sm8850 / sm8750 / sm8650
    版本: 6.12.23               # 与 .github/workflows/sm*_fastbuild_*.yml 文件名版本一致
    参数模式: 默认              # 默认 / 自定义
    # ---- 仅"自定义"模式生效 ----
    KSU分支: resukisu           # resukisu / sukisu / ksunext / ksu（原版，已可用）/ none
    开启susfs: 是               # 是 / 否
    LZ4补丁: 是                 # 是 / 否
    LZ4KD补丁: 否               # 是 / 否（与LZ4互斥，二选一）
    BBR算法: 否                 # 否 / 是 / 默认
    Droidspaces: 否             # 否 / standard / extend
    ADIOS调度器: 是             # 是 / 否（sm8650平台自动适配为SSG）
    Re-Kernel: 否               # 是 / 否
    基带保护: 是                # 是 / 否
    零宽字符漏洞修复: 否         # 是 / 否（fs/unicode ignorable特判移除；防反作弊扫盘/黑名单文件名绕过；上游commit5c26d2f1/CVE-2024-50089已撤回；会轻微降低文件查找性能，默认关闭）
    内核后缀模式: 自动          # 留空 / 自动 / 自定义
    自定义后缀: ""              # 仅"自定义"模式填写；⚠️禁止空格！如 SunsetRNE_20260804_001
    延迟触发: ""                # 格式 2026-08-04 15:00（UTC+8）；留空=立即

  # ---------- 任务2（示例：批量触发多个版本） ----------
  - 平台: sm8750
    版本: 6.6.89
    参数模式: 默认
    内核后缀模式: 留空
    延迟触发: "2026-08-04 20:00"

# 注：本模板解析器为预留扩展（入口B），当前请使用表单入口（compile_dispatcher.yml）